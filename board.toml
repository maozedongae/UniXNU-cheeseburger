[board]
name = "cheeseburger"
soc = "MSM8998"
description = "OnePlus 5"
kit = "cheeseburger"

[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache"]

[firmware]
config = "cheeseburger"
dsc = "Platforms/OnePlus/cheeseburgerPkg/cheeseburger.dsc"
fd = "Build/cheeseburgerPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = [
  "Common/Mu",
  "Common/Mu_OEM_Sample",
  "Silicon/Silicium",
  "Silicon/Qualcomm",
  "Silicium-ACPI",
]
patches = []
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/OnePlus",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]
[bootimg]
embed_payload = true
[firmware.defines]
DEVICE_MODEL = "cheeseburger"
ENABLE_SECUREBOOT = "0"

[kernel]
defconfig = "cheeseburger_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-libpthread-kernel.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
]
extra_args = []

[payload]
volume = "ONEPLUS"
size_mib = 64
loader = "firmware"
title = "XNU Kernel"
dram_size = "0x180000000"
panic_screen = true
timeout = 3
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "cpus=1",
  "keepsyms=1",
  "kt_fixed_zones=240",
  "secluded_mem_mb=0",
]

[payload.adt]
tool = "scripts/make-cheeseburger-adt.py"
chip_id = "0x8998"
owned_memory_size = "0x10000000"
cpu_regs = "0"
unique_chip_id = "0x000089981030d22a"

[bootimg.image]
embed_payload = true
