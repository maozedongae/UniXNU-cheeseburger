[board]
name = "cheeseburger"
soc = "MSM8998"
description = "OnePlus 5"
kit = "cheeseburger"

[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache"]

[kernel]
defconfig = "cheeseburger_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-libpthread-kernel.py",
]

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
slide = "-0x1000000"
roots = [
  "com.apple.driver.AppleARMPlatform",
]
extra_args = []

[payload]
volume = "ONEPLUS"
size_mib = 192
loader = "firmware"
title = "XNU Kernel"
dram_size = "0x180000000"
panic_screen = true
timeout = 3
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "cpus=1",
  "keepsyms=1",
  "kt_fixed_zones=240",
]

[payload.adt]
tool = "scripts/make-cheeseburger-adt.py"
chip_id = "0x8998"
owned_memory_size = "0x10000000"
cpu_regs = "0"
unique_chip_id = "0x000089981030d22a"
